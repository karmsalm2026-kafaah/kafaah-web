<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sulfuric Acid Production — Interactive DCDA PFD with Challenges</title>
  <style>
    :root {
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --color-text-primary: #0f172a;
      --color-text-secondary: #334155;
      --color-text-tertiary: #64748b;
      --color-border-tertiary: #e2e8f0;
      --color-background-secondary: #f8fafc;
      
      /* System Badges */
      --color-background-info: #e0f2fe; --color-text-info: #0369a1;
      --color-background-warning: #fef3c7; --color-text-warning: #b45309;
      --color-background-danger: #fee2e2; --color-text-danger: #b91c1c;
      --color-background-success: #dcfce7; --color-text-success: #15803d;

      /* DCDA Process Flow Line Colors */
      --flow-sulfur: #eab308;     /* Bright Yellow for Elemental Sulfur */
      --flow-gas: #f97316;        /* Orange for SO2/SO3 Process Gases */
      --flow-acid: #dc2626;       /* Red for Corrosive H₂SO₄ Liquid Streams */
      --flow-utility: #0ea5e9;    /* Blue for Air/Water Utilities */
      --flow-exhaust: #94a3b8;    /* Gray for Tail Gas Stack */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-sans); background: #ffffff; padding: 2rem 1rem; }
    .root { max-width: 760px; margin: 0 auto; }
    
    /* SVG Interactive Node Styling */
    .node { cursor: pointer; fill: #ffffff; }
    .node rect { stroke: #cbd5e1; fill: #ffffff; transition: all 0.2s ease; }
    
    /* Color Themes for PFD Blocks */
    .c-yellow rect { stroke: var(--flow-sulfur); fill: #fefcf0; }
    .c-orange rect { stroke: var(--flow-gas); fill: #fffaf5; }
    .c-red rect { stroke: var(--flow-acid); fill: #fff5f5; }
    .c-blue rect { stroke: var(--flow-utility); }
    .c-gray rect { stroke: var(--flow-exhaust); }

    .node:hover rect { stroke-width: 1.5px; filter: drop-shadow(0 4px 6px -1px rgb(0 0 0 / 0.05)); }
    .node.active rect { stroke-width: 2.5px; fill: #f0fdfa; stroke: #0d9488 !important; }

    .th { font-size: 13px; font-weight: 600; fill: var(--color-text-primary); }
    .ts { font-size: 11px; fill: var(--color-text-secondary); }

    /* Details Panel UI Layout */
    .detail-panel { background: var(--color-background-secondary); border: 1px solid var(--color-border-tertiary); border-radius: 8px; padding: 16px 20px; margin-top: 16px; min-height: 90px; transition: all .2s; box-shadow: inset 0 1px 2px rgba(0,0,0,0.02); }
    .detail-panel h3 { font-size: 15px; font-weight: 600; color: var(--color-text-primary); margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
    .detail-panel p { font-size: 13.5px; color: var(--color-text-secondary); line-height: 1.6; margin-bottom: 10px; }
    .badge { display: inline-block; font-size: 11px; padding: 3px 10px; border-radius: 9999px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; margin-left: 8px; }
    
    .badge-warn { background: var(--color-background-warning); color: var(--color-text-warning); }
    .badge-danger { background: var(--color-background-danger); color: var(--color-text-danger); }
    .badge-info { background: var(--color-background-info); color: var(--color-text-info); }
    .badge-ok { background: var(--color-background-success); color: var(--color-text-success); }
    
    .hint { font-size: 12px; color: var(--color-text-tertiary); text-align: center; margin-top: 10px; }
    .kafaah-note { margin-top: 8px; font-size: 12.5px; color: var(--color-text-secondary); border-top: 1px dashed var(--color-border-tertiary); padding-top: 8px; }
    .kafaah-note b { color: #0d9488; }
    .challenge-note { margin-top: 6px; font-size: 12.5px; color: var(--color-text-secondary); }
    .challenge-note b { color: #dc2626; }
  </style>
</head>
<body>

<div class="root">
  <svg width="100%" viewBox="0 0 720 1020" role="img">
    <title>Sulfuric Acid Production — DCDA Process Flow Diagram</title>
    <desc>Interactive PFD illustrating a modern double-contact double-absorption sulfuric acid plant featuring a sulfur melter, waste heat boiler, 4-pass V₂O₅ converter, interpass tower, and final absorption tower.</desc>
    <defs>
      <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <g id="node-air" class="node c-blue" onclick="showDetail('air')">
      <rect x="40" y="30" width="160" height="58" rx="8" stroke-width="1"/>
      <text class="th" x="120" y="52" text-anchor="middle" dominant-baseline="central">Air Drying Tower</text>
      <text class="ts" x="120" y="72" text-anchor="middle" dominant-baseline="central">98% H₂SO₄ circulation</text>
    </g>
    <line x1="120" y1="88" x2="120" y2="140" stroke="var(--flow-utility)" stroke-width="1.5" marker-end="url(#ar)"/>
    <text class="ts" x="75" y="115" fill="var(--color-text-secondary)">Dry Air</text>

    <g id="node-melter" class="node c-yellow" onclick="showDetail('melter')">
      <rect x="260" y="30" width="160" height="58" rx="8" stroke-width="1"/>
      <text class="th" x="340" y="52" text-anchor="middle" dominant-baseline="central">Sulfur Melter & Filter</text>
      <text class="ts" x="340" y="72" text-anchor="middle" dominant-baseline="central">Solid S → Liquid S (135–145°C)</text>
    </g>
    <path d="M340 88 L340 140" fill="none" stroke="var(--flow-sulfur)" stroke-width="1.5" marker-end="url(#ar)"/>
    <text class="ts" x="390" y="115" fill="var(--color-text-secondary)">Molten Sulfur</text>

    <g id="node-burner" class="node c-orange" onclick="showDetail('burner')">
      <rect x="100" y="142" width="340" height="65" rx="8" stroke-width="1.2"/>
      <text class="th" x="270" y="165" text-anchor="middle" dominant-baseline="central">Sulfur Burner (Combustor)</text>
      <text class="ts" x="270" y="185" text-anchor="middle" dominant-baseline="central">S + O₂ → SO₂ | Exothermic (~1000–1100°C)</text>
    </g>
    <line x1="270" y1="207" x2="270" y2="245" stroke="var(--flow-gas)" stroke-width="1.5" marker-end="url(#ar)"/>

    <g id="node-whb" class="node c-blue" onclick="showDetail('whb')">
      <rect x="140" y="247" width="260" height="58" rx="8" stroke-width="1"/>
      <text class="th" x="270" y="268" text-anchor="middle" dominant-baseline="central">Waste Heat Boiler (WHB)</text>
      <text class="ts" x="270" y="288" text-anchor="middle" dominant-baseline="central">Cooling gas to ~420°C | High-P Steam</text>
    </g>
    <line x1="270" y
