<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NPK Physical Blending Plant — Interactive PFD</title>
  <style>
    :root {
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --color-text-primary: #0f172a;
      --color-text-secondary: #334155;
      --color-text-tertiary: #64748b;
      --color-border-tertiary: #e2e8f0;
      --color-background-secondary: #f8fafc;
      
      /* System Badges */
      --color-background-info: #e0f2fe; --color-text-info: #0369a1;
      --color-background-warning: #fef3c7; --color-text-warning: #b45309;
      --color-background-danger: #fee2e2; --color-text-danger: #b91c1c;
      --color-background-success: #dcfce7; --color-text-success: #15803d;

      /* Process Flow Line Colors */
      --flow-solids: #475569;     /* Gray for bulk granules */
      --flow-dust: #8b5cf6;       /* Purple for dust extraction paths */
      --flow-utility: #0ea5e9;    /* Blue for air / cooling liquids */
      --flow-oil: #e11d48;        /* Red for hot anticaking oil/wax lines */
    }

    *{box-sizing:border-box;margin:0;padding:0}
    body { background: #ffffff; padding: 2rem 1rem; }
    .root{font-family:var(--font-sans);padding:1rem; max-width: 750px; margin: 0 auto;}
    
    /* SVG styling classes */
    .node { cursor: pointer; fill: #ffffff; transition: transform 0.2s ease; }
    .node rect { stroke: #cbd5e1; fill: #ffffff; transition: all 0.2s ease; }
    
    /* Color themes for PFD blocks */
    .c-blue rect { stroke: var(--flow-utility); }
    .c-coral rect { stroke: var(--flow-oil); fill: #fff1f2; }
    .c-teal rect { stroke: #14b8a6; }
    .c-purple rect { stroke: var(--flow-dust); fill: #f5f3ff; }
    .c-green rect { stroke: #10b981; fill: #f0fdf4; }
    .c-amber rect { stroke: #f59e0b; }
    .c-gray rect { stroke: #94a3b8; }

    .node:hover rect { stroke-width: 1.5px; filter: drop-shadow(0 4px 6px -1px rgb(0 0 0 / 0.05)); }
    .node.active rect { stroke-width: 2px; fill: #f0fdfa; stroke: #0d9488 !important; }

    .th { font-size: 13px; font-weight: 600; fill: var(--color-text-primary); }
    .ts { font-size: 11px; fill: var(--color-text-secondary); }

    /* Details Panel UI */
    .detail-panel{background:var(--color-background-secondary);border:1px solid var(--color-border-tertiary);border-radius:8px;padding:16px 20px;margin-top:16px;min-height:90px;transition:all .2s; box-shadow: inset 0 1px 2px rgba(0,0,0,0.02);}
    .detail-panel h3{font-size:15px;font-weight:600;color:var(--color-text-primary);margin-bottom:8px; display: flex; align-items: center; justify-content: space-between;}
    .detail-panel p{font-size:13.5px;color:var(--color-text-secondary);line-height:1.6; margin-bottom: 8px;}
    .badge{display:inline-block;font-size:11px;padding:3px 10px;border-radius:9999px;font-weight:500; text-transform: uppercase; letter-spacing: 0.05em;}
    
    .badge-warn{background:var(--color-background-warning);color:var(--color-text-warning)}
    .badge-danger{background:var(--color-background-danger);color:var(--color-text-danger)}
    .badge-info{background:var(--color-background-info);color:var(--color-text-info)}
    .badge-ok{background:var(--color-background-success);color:var(--color-text-success)}
    
    .kafaah-note{margin-top:10px;font-size:12.5px;color:var(--color-text-secondary);border-top:1px dashed var(--color-border-tertiary);padding-top:10px}
    .kafaah-note b{color: #0d9488}
    .challenge-note{margin-top:6px;font-size:12.5px;color:var(--color-text-secondary);}
    .challenge-note b{color: #dc2626}
  </style>
</head>
<body>

<div class="root">
<svg width="100%" viewBox="0 0 720 1120" role="img">
  <title>NPK Physical Blending Plant — Process Flow Diagram</title>
  <desc>Interactive PFD showing multi-bin gravimetric macro dosing, micronutrient trace integration, homogeneous mixing, screening, drum coating, and dedusting circuits.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="20" y="25" font-size="14" font-weight="700" fill="var(--color-text-primary)">STAGE 1: GRAVIMETRIC DOSING & MIXING TRAIN</text>
  <rect x="10" y="35" width="480" height="425" rx="8" fill="none" stroke="#e2e8f0" stroke-dasharray="4 4"/>

  <g id="node-macrohoppers" class="node c-blue" onclick="showDetail('macrohoppers')">
    <rect x="25" y="55" width="130" height="65" rx="6" stroke-width="1.2"/>
    <text class="th" x="90" y="78" text-anchor="middle" dominant-baseline="central">NPK Macro Hoppers</text>
    <text class="ts" x="90" y="98" text-anchor="middle" dominant-baseline="central">Urea, DAP, MOP, SOP</text>
  </g>

  <g id="node-microhoppers" class="node c-teal" onclick="showDetail('microhoppers')">
    <rect x="180" y="55" width="130" height="65" rx="6" stroke-width="1.2"/>
    <text class="th" x="245" y="78" text-anchor="middle" dominant-baseline="central">Minor Nutrients</text>
    <text class="ts" x="245" y="98" text-anchor="middle" dominant-baseline="central">Mg, Ca, S, Secondary</text>
  </g>

  <g id="node-traceelements" class="node c-teal" onclick="showDetail('traceelements')">
    <rect x="335" y="55" width="135" height="65" rx="6" stroke-width="1.2"/>
    <text class="th" x="402" y="78" text-anchor="middle" dominant-baseline="central">Trace Micronutrients</text>
    <text class="ts" x="402" y="98" text-anchor="middle" dominant-baseline="central">B, Zn, Fe, Cu, Mn</text>
  </g>

  <line x1="90" y1="120" x2="90" y2="155" stroke="var(--flow-solids)" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="245" y1="120" x2="245" y2="155" stroke="var(--flow-solids)" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="402" y1="120" x2="402" y2="155" stroke="var(--flow-solids)" stroke-width="1.2" marker-end="url(#ar)"/>
  
  <path d="M90 155 L402 155" fill="none" stroke="var(--flow-solids)" stroke-width="1.5"/>
  <path d="M245 155 L245 175" fill="none" stroke="var(--flow-solids)" stroke-width="1.5" marker-end="url(#ar)"/>

  <g id="node-npkmixer" class="node c-coral" onclick="showDetail('npkmixer')">
    <rect x="125" y="177" width="240" height="60" rx="6" stroke-width="1.5"/>
    <text class="th" x="245" y="198" text-anchor="middle" dominant-baseline="central">Homogeneous Blender Unit</text>
    <text class="ts" x="245" y="218" text-anchor="middle" dominant-baseline="central">Low-Shear Paddle / Rotary Flight</text>
  </g>
  <line x1="245" y1="237" x2="245" y2="275" stroke="var(--flow-solids)" stroke-width="1.5" marker-end="url(#ar)"/>

  <g id="node-scalpingscreen" class="node class-gray" onclick="showDetail('scalpingscreen')">
    <rect x="125" y="277" width="240" height="55" rx="6"/>
    <text class="th" x="245" y="296" text-anchor="middle" dominant-baseline="central">Safety Scalping Screen</text>
    <text class="ts" x="245" y="316" text-anchor="middle" dominant-baseline="central">Oversize Clump / Fines Isolation</text>
  </g>
  <line x1="245" y1="332" x2="245" y2="370" stroke="var(--flow-solids)" stroke-width="1.5" marker-end="url(#ar)"/>

  <g id="node-surgebin" class="node c-gray" onclick="showDetail('surgebin')">
    <rect x="125" y="372" width="240" height="50" rx="6"/>
    <text class="th" x="245" y="388" text-anchor="middle" dominant-baseline="central">Coating Feed Surge Hopper</text>
    <text class="ts" x="245" y="408" text-anchor="middle" dominant-baseline="central">Mass Flow Anti-Segregation Design</text>
  </g>

  <path d="M365 207 L490 207" fill="none" stroke="var(--flow-dust)" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M365 304 L490 304 L490 207" fill="none" stroke="var(--flow-dust)" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M490 207 L530 207" fill="none" stroke="var(--flow-dust)" stroke-width="1.2" marker-end="url(#ar)"/>


  <text x="20" y="495" font-size="14" font-weight="700" fill="var(--color-text-primary)">STAGE 2: SURFACE CONDITIONING & ANTICAKING</text>
  <rect x="10" y="505" width="480" height="425" rx="8" fill="none" stroke="#e2e8f0" stroke-dasharray="4 4"/>

  <path d="M245 422 L245 525" fill="none" stroke="var(--flow-solids)" stroke-width="1.5" marker-end="url(#ar)"/>
  <text class="ts" x="175" y="465" fill="var(--color-text-secondary)">Uncoated Core Granules</text>

  <g id="node-coatingagent" class="node c-coral" onclick="showDetail('coatingagent')">
    <rect x="25" y="525" width="140" height="55" rx="6"/>
    <text class="th" x="95" y="544" text-anchor="middle" dominant-baseline="central">Anticaking Compound</text>
    <text class="ts" x="95" y="564" text-anchor="middle" dominant-baseline="central">Oil / Fatty Amine Wax</text>
  </g>

  <g id="node-heatinglump" class="node c-coral" onclick="showDetail('heatinglump')">
    <rect x="25" y="615" width="140" height="50" rx="6"/>
    <text class="th" x="95" y="632" text-anchor="middle" dominant-baseline="central">Thermal Melt Unit</text>
    <text class="ts" x="95" y="650" text-anchor="middle" dominant-baseline="central">Target: 70–80 °C Liquid</text>
  </g>
  <line x1="95" y1="580" x2="95" y2="615" stroke="var(--flow-oil)" stroke-width="1.2" marker-end="url(#ar)"/>
  <path d="M95 665 L95 725 L180 725" fill="none" stroke="var(--flow-oil)" stroke-width="1.2" marker-end="url(#ar)"/>

  <g id="node-coatingdrum" class="node c-teal" onclick="showDetail('coatingdrum')">
    <rect x="195" y="692" width="250" height="65" rx="6" stroke-width="1.5"/>
    <text class="th" x="320" y="715" text-anchor="middle" dominant-baseline="central">Rotary Conditioning Drum</text>
    <text class="ts" x="320" y="735" text-anchor="middle" dominant-baseline="central">Twin-Fluid Nozzle Boundary Coating</text>
  </g>
  
  <path d="M245 580 L245 692" fill="none" stroke="var(--flow-solids)" stroke-width="1.5" marker-end="url(#ar)"/>

  <g id="node-powderfeed" class="node c-gray" onclick="showDetail('powderfeed')">
    <rect x="290" y="525" width="155" height="55" rx="6"/>
    <text class="th" x="367" y="544" text-anchor="middle" dominant-baseline="central">Inert Talc/Clay Silo</text>
    <text class="ts" x="367" y="564" text-anchor="middle" dominant-baseline="central">Dusting Agent Feeder</text>
  </g>
  <path d="M367 580 L367 692" fill="none" stroke="var(--flow-solids)" stroke-width="1.2" marker-end="url(#ar)"/>

  <line x1="320" y1="757" x2="320" y2="800" stroke="var(--flow-solids)" stroke-width="1.5" marker-end="url(#ar)"/>

  <g id="node-productpacking" class="node c-green" onclick="showDetail('productpacking')">
    <rect x="195" y="802" width="250" height="55" rx="6" stroke-width="1.2"/>
    <text class="th" x="320" y="820" text-anchor="middle" dominant-baseline="central">Finished NPK Bagging Silo</text>
    <text class="ts" x="320" y="840" text-anchor="middle" dominant-baseline="central">To Big-Bag / 50kg Packing Lines</text>
  </g>

  <path d="M445 725 L470 725" fill="none" stroke="var(--flow-dust)" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M470 725 L470 550 L490 550" fill="none" stroke="var(--flow-dust)" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M490 550 L530 550" fill="none" stroke="var(--flow-dust)" stroke-width="1" marker-end="url(#ar)"/>


  <text x="515" y="25" font-size="14" font-weight="700" fill="var(--color-text-primary)">VENTILATION & DUST CONTROL</text>
  <rect x="505" y="35" width="205" height="900" rx="8" fill="none" stroke="#e2e8f0" stroke-dasharray="4 4"/>

  <g id="node-baghouse" class="node c-purple" onclick="showDetail('baghouse')">
    <rect x="520" y="165" width="175" height="75" rx="6" stroke-width="1.5"/>
    <text class="th" x="607" y="192" text-anchor="middle" dominant-baseline="central">Pulse-Jet Bag Filter</text>
    <text class="ts" x="607" y="214" text-anchor="middle" dominant-baseline="central">Primary Granule Dust Hook</text>
    <text class="ts" x="607" y="226" text-anchor="middle" dominant-baseline="central">PTFE Membrane Matrices</text>
  </g>
  <line x1="607" y1="240" x2="607" y2="390" stroke="var(--flow-utility)" stroke-width="1.2" marker-end="url(#ar)"/>

  <g id="node-wetventuri" class="node c-purple" onclick="showDetail('wetventuri')">
    <rect x="520" y="392" width="175" height="70" rx="6"/>
    <text class="th" x="607" y="415" text-anchor="middle" dominant-baseline="central">Wet Venturi Scrubber</text>
    <text class="ts" x="607" y="435" text-anchor="middle" dominant-baseline="central">Soluble Fertilizer Fines Reclaim</text>
    <text class="ts" x="607" y="448" text-anchor="middle" dominant-baseline="central">Liquor Recycle Target Balance</text>
  </g>
  <line x1="607" y1="462" x2="607" y2="760" stroke="var(--flow-utility)" stroke-width="1.2" marker-end="url(#ar)"/>

  <g id="node-exhauststack" class="node c-gray" onclick="showDetail('exhauststack')">
    <rect x="520" y="762" width="175" height="60" rx="6" stroke-width="1.5"/>
    <text class="th" x="607" y="785" text-anchor="middle" dominant-baseline="central">Exhaust Fan & Stack</text>
    <text class="ts" x="607" y="805" text-anchor="middle" dominant-baseline="central">Particulates &lt; 20 mg/Nm³</text>
  </g>

  <text class="ts" x="360" y="970" text-anchor="middle" fill="var(--color-text-secondary)" opacity="0.7" style="font-weight: 500;">↑ Click any process node above to view core technical advisory details.</text>
</svg>

<div class="detail-panel" id="detail-box">
  <p style="color:var(--color-text-tertiary); font-style: italic;">Click any process node above to see technical detail and advisory focuses.</p>
</div>
</div>

<script>
const data = {
  macrohoppers: {
    title: 'Macro Granular Storage & Gravimetric Dosing Hoppers',
    badge: ['Primary Feeds','info'],
    body: 'Manages incoming high-purity granular elements (such as Urea, DAP, MAP, MOP, or SOP). Individual silos use loss-in-weight feeders or continuous weigh belts to regulate stream flows. Granule size distribution consistency across all ingredients is critical to prevent post-blending segregation.',
    kafaah: 'Weigh controller loop calibration, checking input granule compatibility charts, and sizing symmetry analysis.',
    challenge: 'Mismatched particle sizes (e.g., fine MOP blended with large urea granules) causing size segregation inside bulk trucks and bag streams, leading to off-spec commercial analysis.'
  },
  microhoppers: {
    title: 'Secondary & Minor Nutrient Hoppers',
    badge: ['Secondary Salts','info'],
    body: 'Feeds secondary macronutrients (such as Magnesium Sulfate, Calcium Sulfate, or Kieserite granular fractions) into the formulation batch. These components are accurately metered to fulfill customized commercial soil grade targets.',
    kafaah: 'Dosing screw precision diagnostics, moisture tracking, and chemical formulation cross-checks.',
    challenge: 'High moisture absorption in secondary salts causing bridging across hopper throats, stopping secondary element delivery.'
  },
  traceelements: {
    title: 'Trace Element & Micronutrient Addition Unit',
    badge: ['Micronutrients','info'],
    body: 'Controls the micro-addition of vital trace metals (Boron as borax, Zinc Sulfate, Iron Sulfate, Copper, Manganese). Because these elements make up a very low percentage of the total formulation, precise automated control loops are required to ensure uniform distribution.',
    kafaah: 'Micro-gravimetric system tuning, validation of homogeneous pre-mixes, and tracer index checking.',
    challenge: 'Poor dispersion patterns creating highly concentrated pockets of trace elements next to trace-deficient zones in the final product.'
  },
  npkmixer: {
    title: 'Low-Shear Homogeneous NPK Blender',
    badge: ['Blending Core','danger'],
    body: 'Blends all granular inputs into a uniform mixture. The unit leverages low-shear rotary drum actions or paddle configurations designed to achieve high blending uniformity within brief cycle windows while minimizing physical grain fracture.',
    kafaah: 'Blending uniformity index testing, paddle tip clearance validation, and optimal retention timing logs.',
    challenge: 'Excessive rotational velocity or extended blend times causing granule degradation and generating fine dust, which increases caking risks during storage.'
  },
  scalpingscreen: {
    title: 'Safety Scalping & De-dusting Screen',
    badge: ['Quality Control','info'],
    body: 'Processes the raw blend through a high-capacity screening deck prior to surface conditioning. This step removes oversize material lumps, raw material bag scraps, or fine debris to isolate the required target granule spectrum.',
    kafaah: 'Screen cloth tension metrics, amplitude optimization, and oversized discharge tracing.',
    challenge: 'Screen blinding from damp fines carryover, allowing oversize lumps to bypass the screen and block down-stream bagging scale gates.'
  },
  surgebin: {
    title: 'Coating Feed Surge Hopper',
    badge: ['Process Buffer','info'],
    body: 'Acts as a continuous production buffer between the blending section and the downstream rotary coating drum. Features an anti-segregation interior geometry to preserve blend uniformity during levels shifts.',
    kafaah: 'Level sensor testing, mass-flow valve alignment, and structural shell wall auditing.',
    challenge: 'Funnel-flow patterns causing funneling and granule size segregation, resulting in uneven NPK concentrations between bag batches.'
  },
  coatingagent: {
    title: 'Anticaking Compound Storage & Pump Loop',
    badge: ['Surface Protect','warn'],
    body: 'Manages the delivery of specialized oil- or fatty amine wax-based anticaking compounds. This coating creates a hydrophobic surface barrier on the granules, preventing moisture absorption and moisture-bridge crystal formatting during storage.',
    kafaah: 'Pump calibration profiles, viscosity indexing against temperature variations, and consumption balancing.',
    challenge: 'Fluctuations in compound viscosity due to seasonal tracking errors, leading to inadequate granule surface coverage.'
  },
  heatinglump: {
    title: 'Thermal Melt Tank & Utility Loop',
    badge: ['Thermal Control','info'],
    body: 'Heats solid or highly viscous anticaking waxes to their optimal fluid operational windows (typically 70–80 °C). Precise temperature control is required to achieve the low viscosity necessary for fine nozzle atomization.',
    kafaah: 'Steam tracing efficiency audits, safety interlock checks, and thermal controller optimization.',
    challenge: 'Heating line failures causing wax solidification inside the feed line, choking the spray array and interrupting plant operations.'
  },
  coatingdrum: {
    title: 'Rotary Conditioning & Coating Drum',
    badge: ['Coating Action','danger'],
    body: 'Granules pass through a rotating drum equipped with internal lifters that create a cascading curtain. Twin-fluid atomizing nozzles spray the heated anticaking agent onto the product. Inert talc or clay powder can also be added to form a non-sticky surface finish.',
    kafaah: 'Nozzle spray pattern alignment, flight configuration reviews, and granule surface coverage evaluations.',
    challenge: 'Nozzle blockage or poor atomization forming large liquid droplets, creating sticky product clusters that blind down-stream packaging chutes.'
  },
  powderfeed: {
    title: 'Inert Powder Coating Silo & Feeder',
    badge: ['Conditioning Dust','info'],
    body: 'Meters fine inert powders (such as micronized talc, kaolin clay, or diatomaceous earth) into the rear section of the coating drum. This powder adheres to the oiled granule surface, creating a protective layer that enhances anti-caking performance.',
    kafaah: 'Powder feeder synchronization, loss-in-weight tracking, and powder-to-oil ratio balancing.',
    challenge: 'Excessive powder addition generating free ambient dust in the drum, which loads the emission baghouse and increases raw material losses.'
  },
  productpacking: {
    title: 'Finished NPK Bagging Silo',
    badge: ['Inventory Stream','ok'],
    body: 'Receives the fully conditioned, caking-resistant granular NPK fertilizer. Product is held under controlled relative humidity conditions before transfer to automated 50kg bagging machines or big-bag packaging stations.',
    kafaah: 'Bagging scale weight calibration checks, moisture ingress auditing, and product hardness analysis.',
    challenge: 'Packaging product with high residual temperatures into plastic bags, causing moisture condensation on internal bag faces and driving localized granule dissolution.'
  },
  baghouse: {
    title: 'Pulse-Jet Aspiration Bag Filter',
    badge: ['Dust Extraction','danger'],
    body: 'Provides negative draft ventilation to key dust-generation sources (such as weigh scales, blenders, screens, and hopper drops). High-efficiency PTFE membrane bags filter out airborne dust particles, returning reclaimed materials back to the process.',
    kafaah: 'Differential pressure monitoring, pulse valve sequence optimization, and bag structural inspections.',
    challenge: 'Damp air ingress causing fertilizer dust to form a crust on the filter bags ("mud-coaxing"), which restricts ventilation draft and causes dust buildup around the blending machinery.'
  },
  wetventuri: {
    title: 'Wet Venturi Scrubber System',
    badge: ['Emission Clean','danger'],
    body: 'Processes air streams carrying ultra-fine or sticky fertilizer dust that cannot be managed by dry baghouses alone. High-velocity liquid shearing traps particulates into a recycling liquor stream, preventing environmental stack emissions.',
    kafaah: 'Liquid-to-gas flow balances, throat delta-P monitoring, and liquor bleed control loops.',
    challenge: 'Crystallization and scale buildup inside the Venturi throat section from highly saturated recycling liquors, reducing scrubbing draft efficiency.'
  },
  exhauststack: {
    title: 'Main Exhaust Fan & Stack Assembly',
    badge: ['Compliance','danger'],
    body: 'Draws treated process air from the filtration loops and discharges it to the atmosphere. Continuous monitoring guarantees total particulate emissions remain securely below 20 mg/Nm³ to fulfill strict industrial frameworks.',
    kafaah: 'Fan impeller balance reviews, CEMS verification logs, and emission profile auditing.',
    challenge: 'Aerosol or fine particulate carryover caused by upstream scrubber flooding, resulting in visible stack plume alerts.'
  }
};

function showDetail(key) {
  const d = data[key];
  if (!d) return;
  const [badgeLabel, badgeType] = d.badge;
  
  const panel = document.getElementById('detail-box');
  panel.innerHTML = `
    <h3>${d.title} <span class="badge badge-${badgeType}">${badgeLabel}</span></h3>
    <p>${d.body}</p>
    <p class="kafaah-note"><b>Optimization Focus:</b> ${d.kafaah}</p>
    <p class="challenge-note"><b>Operational Challenge:</b> ${d.challenge}</p>
  `;
  
  document.querySelectorAll('.node').forEach(node => node.classList.remove('active'));
  const activeNode = document.getElementById(`node-${key}`);
  if (activeNode) activeNode.classList.add('active');

  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
</script>

</body>
</html>
